services:
  postgres:
    image: postgres:alpine
    container_name: rozae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rozae}
      POSTGRES_USER: ${POSTGRES_USER:-rozae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rozae}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rozae} -d ${POSTGRES_DB:-rozae}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
